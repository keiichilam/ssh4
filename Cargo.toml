[package]
name = "ssh4"
version = "0.1.0"
edition = "2021"
description = "Rust SSH client with GUI (egui) and CLI (crossterm) modes"
license = "MIT"

[dependencies]
ssh-rs = { path = "vendor/ssh-rs-0.5.0", features = ["scp"] }
eframe = "0.28"
egui = "0.28"
vt100 = "0.15"
crossterm = "0.28.1"
arboard = "3.4"
image = "0.25"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
rfd = "0.14"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[[bin]]
name = "ssh4"
path = "src/main.rs"
